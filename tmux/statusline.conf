# Colours + powerline style: TokyoNight "moon" (same as the nvim colorscheme),

# --- bar: single line (status on), bottom ---
set -g status on
set -g status-position bottom
set -g status-interval 3
set -g status-justify left
set -g status-style "fg=#82aaff,bg=#1e2030"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left-style NONE
set -g status-right-style NONE

# --- pane borders / messages / copy mode (tokyonight moon) ---
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"
set -g message-style "fg=#82aaff,bg=#3b4261"
set -g message-command-style "fg=#82aaff,bg=#3b4261"
set -g mode-style "fg=#82aaff,bg=#3b4261"
set -g clock-mode-colour "#82aaff"
set -g clock-mode-style 24
set -g display-panes-colour "#3b4261"
set -g display-panes-active-colour "#82aaff"

set -g status-left "#[fg=#1b1d2b,bg=#82aaff,bold]  #h #[fg=#82aaff,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261,bold] #S #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]"

# --- window list: inactive plain + thin separator, current = fg_gutter block ---
set -g window-status-format "#[fg=#828bb8,bg=#1e2030,nobold,nounderscore,noitalics] #I  #W "
set -g window-status-current-format "#[fg=#1e2030,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261,bold,nounderscore,noitalics] #I  [#{pane_current_command}] #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]"
set -g window-status-separator ""
setw -g window-status-style "NONE,fg=#828bb8,bg=#1e2030"
setw -g window-status-current-style "NONE"

set -g status-right "#[fg=#82aaff,bg=#1e2030]  #[fg=#828bb8]#([ #{pane_current_path} = $HOME ] && echo '~' || basename #{pane_current_path}) #[fg=#3b4261,bg=#1e2030] #[fg=#82aaff,bg=#1e2030] #[fg=#828bb8]#(free | awk '/^Mem/ { printf(\"%.0f%%\", $3/$2 * 100 - 0.5) }' ) #[fg=#3b4261,bg=#1e2030]#[fg=#82aaff,bg=#3b4261]  #[fg=#828bb8]#(date +%Y-%m-%d) #[fg=#82aaff,bg=#3b4261]#[fg=#1b1d2b,bg=#82aaff,bold]  #(date +%H:%M) "
